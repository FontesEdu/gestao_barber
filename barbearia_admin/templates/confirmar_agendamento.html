<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Agendamento | Estação Barber</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg-dark: #0a1128;
            --color-bg-card: #131b35;
            --color-bg-secondary: #1a2447;
            --color-bg-muted: #1f2a4d;
            --color-text-primary: #f9fafb;
            --color-text-secondary: #a0a8bd;
            --color-primary: #f59e0b;
            --color-primary-dark: #d97706;
            --color-border: #1f2a4d;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg-dark);
            color: var(--color-text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= NAVIGATION (PADRONIZADA) ================== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background-color: rgba(10, 17, 40, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--color-border);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-sm) var(--spacing-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .nav-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-text-primary);
        }

        .nav-title a {
            text-decoration: none;
            color: var(--color-text-primary);
            transition: color 0.3s ease;
        }

        .nav-title a:hover {
            color: var(--color-primary);
        }

        .nav-links {
            display: none;
            gap: var(--spacing-lg);
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            color: var(--color-text-primary);
            text-decoration: none;
            transition: color 0.3s ease;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--color-primary);
        }

        /* Botão estilizado como no padrão enviado */
        .btn-nav {
            padding: 0.625rem 1.5rem;
            background-color: var(--color-primary);
            color: var(--color-bg-dark);
            border-radius: var(--radius-md);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-nav:hover {
            background-color: var(--color-primary-dark);
            transform: translateY(-2px);
        }

        /* Menu Mobile Button */
        .mobile-menu-btn {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: var(--spacing-xs);
        }

        .mobile-menu-btn span {
            width: 24px;
            height: 2px;
            background-color: var(--color-text-primary);
            transition: all 0.3s ease;
        }

        /* Menu Mobile Estilizado */
        .mobile-menu {
            display: none;
            position: fixed;
            top: 73px;
            left: 0;
            right: 0;
            background-color: var(--color-bg-card);
            border-bottom: 1px solid var(--color-border);
            flex-direction: column;
            padding: var(--spacing-md);
            gap: var(--spacing-sm);
            z-index: 40;
        }

        .mobile-menu.active { display: flex; }

        .mobile-menu a {
            color: var(--color-text-primary);
            text-decoration: none;
            padding: var(--spacing-sm);
            transition: color 0.3s ease;
        }

        /* ================= CONTEÚDO ================== */
        .container {
            max-width: 500px;
            margin: 140px auto 60px auto;
            padding: 0 var(--spacing-md);
            flex: 1;
        }

        .card {
            background-color: var(--color-bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            padding: var(--spacing-lg);
            text-align: center;
        }

        .info-box {
            background-color: var(--color-bg-secondary);
            border-left: 4px solid var(--color-primary);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--color-bg-secondary);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .submit-btn {
            width: 100%;
            padding: var(--spacing-md);
            background-color: var(--color-primary);
            color: var(--color-bg-dark);
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        /* ================= FOOTER ================== */
        .footer {
            padding: var(--spacing-lg) 0;
            background-color: var(--color-bg-dark);
            border-top: 1px solid var(--color-border);
        }

        /* RESPONSIVO */
        @media (min-width: 768px) {
            .nav-links { display: flex; }
            .mobile-menu-btn { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="nav-title"><a href="/">Estação Barber</a></span>
            </div>
            
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <span></span><span></span><span></span>
            </button>

            <ul class="nav-links">
                <li><a href="/">Início</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#servicos">Serviços</a></li>
                <li><a href="#contatos">Contatos</a></li>
                <li><a href="{% url 'ver_horarios' %}" class="btn-nav">Ver Horário</a></li>
            </ul>
        </div>
    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <a href="/">Início</a>
        <a href="#sobre">Sobre</a>
        <a href="#servicos">Serviços</a>
        <a href="#contatos">Contatos</a>
        <a href="{% url 'ver_horarios' %}">Ver Horário</a>
    </div>

    <div class="container">
        <div class="card">
            <h1 style="margin-bottom: 20px;">Confirme seu agendamento</h1>
            <div class="info-box">
                <p style="color: var(--color-text-secondary);">Data: <strong>{{ data|date:'d/m/Y' }}</strong></p>
                <p style="color: var(--color-text-secondary);">Horário: <strong>{{ horario }}</strong></p>
            </div>

            <form action="{% url 'finalizar_agendamento' %}" method="POST" style="text-align: left;">
                {% csrf_token %}
                <input type="hidden" name="data" value="{{ data }}">
                <input type="hidden" name="horario" value="{{ horario }}">
                
                <label>Nome:</label>
                <input type="text" name="nome" required placeholder="Seu nome">
                
                <label>Telefone:</label>
                <input type="text" name="telefone" id="telefone" required placeholder="(00) 00000-0000">
                
                <button type="submit" class="submit-btn">Finalizar Agendamento</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div style="text-align: center;">
            <p style="color: var(--color-text-secondary); font-size: 0.9rem;">
                © <span id="currentYear"></span> Estação Barber.
            </p>
        </div>
    </footer>

    <script>
        $(document).ready(function(){
            $('#telefone').mask('(00) 00000-0000');
            $('#currentYear').text(new Date().getFullYear());

            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');

            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('active');
                mobileMenuBtn.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
